<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tec Simulado</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 id="form-title" class="auth-title">Entrar</h2>

            <form id="auth-form">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" required placeholder="Seu nome de usuário">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" required placeholder="Sua senha">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submit-btn" style="width: 100%;">Entrar</button>
            </form>

            <div class="auth-footer">
                <button id="toggle-auth" class="btn btn-ghost">Criar nova conta</button>
            </div>

            <p id="message"
                style="margin-top: 15px; color: var(--danger-color); text-align: center; font-size: 13px; min-height: 20px;">
            </p>
        </div>
    </div>
    <script src="assets/js/auth.js"></script>
</body>

</html>
